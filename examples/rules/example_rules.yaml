---
title: Malware Beaconing Detection
id: rule-beaconing
description: Detects periodic outbound connections characteristic of C2 beaconing
status: experimental
author: SentinelEye
date: 2026/06/29
tags:
  - attack.command_and_control
  - attack.t1071.001
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    EventID: 5156
    DestinationPort:
      - 80
      - 443
      - 8080
      - 8443
    Initiated: "true"
  condition: selection
level: high
falsepositives:
  - Regular software updates
  - Web browsing activity
  - Cloud service synchronization
references:
  - https://attack.mitre.org/techniques/T1071/001/

---
title: Local Account Enumeration
id: rule-account-enum
description: Detects enumeration of local accounts via net user or similar commands
status: experimental
author: SentinelEye
date: 2026/06/29
tags:
  - attack.discovery
  - attack.t1087.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: "\\net.exe"
    CommandLine|contains:
      - "user"
      - "group"
      - "localgroup"
  condition: selection
level: medium
falsepositives:
  - Administrative tasks
  - IT support scripts
references:
  - https://attack.mitre.org/techniques/T1087/001/

