# SentinelEye Example Rules
# Format: Sigma-compatible detection rules

---
title: SSH Brute Force Detection
id: rule-ssh-brute-force
description: Detects multiple failed SSH authentication attempts from the same source IP
status: experimental
author: SentinelEye
date: 2026/06/29
tags:
  - attack.initial_access
  - attack.t1110
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith: "/sshd"
    CommandLine|contains: "Failed password"
  condition: selection
level: high
falsepositives:
  - Legitimate password mistakes
  - Automated monitoring scripts
references:
  - https://attack.mitre.org/techniques/T1110/

---
title: Malicious PowerShell Execution
id: rule-malicious-powershell
description: Detects potentially malicious PowerShell execution patterns
status: experimental
author: SentinelEye
date: 2026/06/29
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: "\\powershell.exe"
    CommandLine|contains:
      - "-enc"
      - "-EncodedCommand"
      - "IEX"
      - "Invoke-Expression"
      - "DownloadString"
      - "Hidden"
  condition: selection
level: high
falsepositives:
  - Administrative scripts
  - Legitimate software deployment
references:
  - https://attack.mitre.org/techniques/T1059/001/

---
title: Suspicious Service Installation
id: rule-suspicious-service
description: Detects installation of suspicious Windows services (potential persistence)
status: experimental
author: SentinelEye
date: 2026/06/29
tags:
  - attack.persistence
  - attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    EventID: 7045
    ImagePath|contains:
      - "\\Users\\Public\\"
      - "\\Temp\\"
      - "\\AppData\\"
    ServiceType: "user_mode_service"
  condition: selection
level: medium
falsepositives:
  - Legitimate software installations in non-standard paths
references:
  - https://attack.mitre.org/techniques/T1543/003/

